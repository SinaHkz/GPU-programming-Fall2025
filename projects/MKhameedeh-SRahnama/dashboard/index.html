<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPU Trainer Dashboard</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 20px; max-width: 980px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; }
      canvas { width: 100%; height: 260px; }
      code { background: #f6f6f6; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>GPU Trainer Dashboard</h1>
    <p>Serving metrics from <code id="runDir"></code></p>
    <div class="row">
      <div class="card">
        <h3>Loss</h3>
        <canvas id="loss"></canvas>
      </div>
      <div class="card">
        <h3>Accuracy</h3>
        <canvas id="acc"></canvas>
      </div>
    </div>
    <div class="row" style="margin-top: 16px;">
      <div class="card">
        <h3>GPU Memory Free (MB)</h3>
        <canvas id="memFree"></canvas>
      </div>
      <div class="card">
        <h3>Step Time (s)</h3>
        <canvas id="stepS"></canvas>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
